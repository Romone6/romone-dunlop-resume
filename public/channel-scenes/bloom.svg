<path d="M668 900q98-173 226-282t289-93" fill="none" stroke="#a78a51" stroke-width="195"/><path d="M668 900q98-173 226-282t289-93" fill="none" stroke="url(#road)" stroke-width="177"/><path class="route" d="M668 900q98-173 226-282t289-93" fill="none" stroke="#fff4cd" stroke-width="10"/>
