<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#52bde7"/><stop offset=".62" stop-color="#c7e9dc"/><stop offset="1" stop-color="#f8e9ba"/></linearGradient>
 <linearGradient id="road" x2="0" y2="1"><stop stop-color="#d9c997"/><stop offset="1" stop-color="#efe2ad"/></linearGradient>
 <pattern id="grain" width="90" height="90" patternUnits="userSpaceOnUse"><circle cx="9" cy="17" r="2" fill="#507547" opacity=".14"/><circle cx="67" cy="60" r="2" fill="#507547" opacity=".13"/></pattern>
 <style>.cloud{animation:cloud 36s linear infinite}.c2{animation-delay:-17s;animation-duration:46s}.grass{transform-box:fill-box;transform-origin:bottom;animation:grass 3.4s ease-in-out infinite alternate}.g2{animation-delay:-1.4s}.spark{animation:spark 2.1s ease-in-out infinite alternate}.route{stroke-dasharray:14 30;animation:route 10s linear infinite}@keyframes cloud{to{transform:translateX(100px)}}@keyframes grass{to{transform:rotate(3deg)}}@keyframes spark{to{opacity:.2;transform:scale(.6)}}@keyframes route{to{stroke-dashoffset:-300}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/><circle cx="1335" cy="145" r="68" fill="#ffdf58" stroke="#39509a" stroke-width="6"/>
<g fill="#fff" stroke="#3863a4" stroke-width="5"><path class="cloud" d="M105 185h196a51 51 0 0 0-98-24 70 70 0 0 0-135 24z"/><path class="cloud c2" d="M814 120h159a40 40 0 0 0-75-17 58 58 0 0 0-111 17z"/></g>
