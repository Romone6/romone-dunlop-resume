<path d="M0 595q168-99 321-19t342 0q221-114 408-5t529-11v340H0z" fill="#79b866" stroke="#395b45" stroke-width="8"/><path d="M0 655q260-76 417-8 230 99 411-6 221-130 772-38v297H0z" fill="#63a65d"/>
