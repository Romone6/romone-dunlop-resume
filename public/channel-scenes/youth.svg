 <style>
 .ink{stroke:#292725;stroke-width:8;stroke-linejoin:round;stroke-linecap:round}.cloud{animation:drift 27s linear infinite}.c2{animation-duration:37s;animation-delay:-20s}.leaf{transform-box:fill-box;transform-origin:bottom;animation:leaf 4s ease-in-out infinite alternate}.l2{animation-delay:-2s}.van{animation:drive 24s linear infinite}@keyframes drift{to{transform:translateX(150px)}}@keyframes leaf{to{transform:rotate(3deg)}}@keyframes drive{from{transform:translateX(-480px)}to{transform:translateX(1900px)}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}}
 </style>
