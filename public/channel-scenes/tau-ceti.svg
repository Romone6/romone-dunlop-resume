<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="space" x2="0" y2="1"><stop stop-color="#0c1937"/><stop offset=".68" stop-color="#172d51"/><stop offset="1" stop-color="#345870"/></linearGradient>
 <linearGradient id="water" x2="0" y2="1"><stop stop-color="#31546b"/><stop offset="1" stop-color="#102338"/></linearGradient>
 <linearGradient id="planet" x2="0" y2="1"><stop stop-color="#f7c869"/><stop offset=".5" stop-color="#ef8769"/><stop offset="1" stop-color="#96536c"/></linearGradient>
 <style>.star{animation:twinkle 2.1s ease-in-out infinite alternate}.s2{animation-delay:-1.1s}.ship{animation:ship 19s ease-in-out infinite alternate}.orb{transform-origin:1308px 155px;animation:orbit 60s linear infinite}.signal{transform-box:fill-box;transform-origin:center;animation:signal 4s ease-out infinite}.s3{animation-delay:-2s}.shine{animation:shine 4s ease-in-out infinite alternate}@keyframes twinkle{to{opacity:.18}}@keyframes ship{to{transform:translate(280px,-62px)}}@keyframes orbit{to{transform:rotate(12deg)}}@keyframes signal{from{opacity:.7;transform:scale(.2)}to{opacity:0;transform:scale(1.5)}}@keyframes shine{to{opacity:.25}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
</defs>
<rect width="1600" height="900" fill="url(#space)"/>
